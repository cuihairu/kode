[package]
name = "kode-server"
description = "kode2 LSP stdio server: lifecycle, document sync, health (book §3/§4 CORE-001/002/003/015/016)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kode-server"
path = "src/main.rs"

[[bin]]
name = "dump-hover-golden"
path = "src/bin/dump-hover-golden.rs"

[[bin]]
name = "dump-completion-golden"
path = "src/bin/dump-completion-golden.rs"

[[bin]]
name = "dump-flag-domains-golden"
path = "src/bin/dump-flag-domains-golden.rs"

[[bin]]
name = "dump-wire-golden"
path = "src/bin/dump-wire-golden.rs"

[[bin]]
name = "dump-def-md5-golden"
path = "src/bin/dump-def-md5-golden.rs"

[[bin]]
name = "validate-process-topology"
path = "src/bin/validate-process-topology.rs"

[lib]
name = "kode_server"
path = "src/lib.rs"

[dependencies]
kode-protocol = { path = "../kode-protocol" }
kode-db-clone = { path = "../kode-db-clone" }
kode-vfs = { path = "../kode-vfs" }
kode-parser = { path = "../kode-parser" }
kode-python = { path = "../kode-python" }
kode-index = { path = "../kode-index" }
kode-types = { path = "../kode-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
