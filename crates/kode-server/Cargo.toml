[package]
name = "kode-server"
description = "kode2 LSP stdio server: lifecycle, document sync, health (book §3/§4 CORE-001/002/003/015/016)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kode-server"
path = "src/main.rs"

[lib]
name = "kode_server"
path = "src/lib.rs"

[dependencies]
kode-protocol = { path = "../kode-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
