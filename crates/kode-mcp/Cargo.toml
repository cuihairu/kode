[package]
name = "kode-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP server exposing kode's def knowledge base to AI agents (MCP-001)."

[dependencies]
kode-parser = { path = "../kode-parser" }
kode-server = { path = "../kode-server" }
rmcp = { version = "3.7", default-features = true, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rmcp = { version = "3.7", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["process", "io-util"] }

[lints]
workspace = true

[[bin]]
name = "kode-mcp"
path = "src/main.rs"
