# pnpm 10+ 设置迁到本文件（pnpm 12 不再读 package.json 的 pnpm 字段）
# 2026-10-10 用户令：组件全部钉最新（pnpm 8.15.0 已被官方标记 deprecated）

# esbuild 需要跑安装脚本；pnpm 10+ 默认拦全部构建脚本，不放行会
# ERR_PNPM_IGNORED_BUILDS 导致打包产物缺原生二进制
# 新包发布年龄门槛：设 0 避免 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION
# （CI 拉新版本依赖时会卡）
minimumReleaseAge: 0

# 依赖版本钉死（原 package.json 的 pnpm.overrides，安全修补用）
overrides:
  '@tootallnate/once': '3.0.1'
  '@vue/server-renderer': '3.5.42'
  '@vue/shared': '3.5.42'
  brace-expansion: '1.1.21'
  braces: '3.0.3'
  diff: '5.2.2'
  esbuild: '0.25.0'
  form-data: '2.5.4'
  got: '11.8.5'
  http-proxy-middleware: '2.0.9'
  js-yaml: '4.3.2'
  json5: '1.0.2'
  loader-utils: '1.4.2'
  micromatch: '4.0.8'
  minimatch: '3.1.4'
  markdown-it: '12.3.2'
  nanoid: '3.3.18'
  node-forge: '1.4.0'
  nth-check: '2.0.1'
  path-to-regexp: '0.1.13'
  postcss: '8.5.23'
  serialize-javascript: '7.0.5'
  source-map-js: '1.2.2'
  tough-cookie: '4.1.3'
  vite: '7.3.5'
  vue: '3.5.42'

allowBuilds:
  esbuild: true
