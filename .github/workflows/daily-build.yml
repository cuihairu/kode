name: Daily Build (nightly)

on:
  schedule:
    # 离峰非整点：每天 03:17 UTC（北京时间 11:17），避开 GitHub Actions 高峰
    - cron: '17 3 * * *'
  workflow_dispatch: # 手动触发必建

permissions:
  contents: write # 创建/更新 Release 需要

jobs:
  build-and-release:
    name: Build & Rolling Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建/更新 Release 需要(job 级再声明一次,不依赖默认)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.repository == 'cuihairu/kode'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史做 48h 判断与 commit 信息

      # 48h 停滞门：仅对 schedule 生效；workflow_dispatch 跳过检查必建
      - name: Stagnation gate (48h no new commits on default branch → skip)
        if: github.event_name == 'schedule'
        id: stagnation
        run: |
          # 取默认分支最近一次提交时间（UNIX 秒）
          LATEST=$(git log -1 --format=%ct origin/main)
          NOW=$(date +%s)
          DIFF_HOURS=$(( (NOW - LATEST) / 3600 ))
          echo "latest_commit_ts=$LATEST" >> $GITHUB_OUTPUT
          echo "diff_hours=$DIFF_HOURS" >> $GITHUB_OUTPUT
          if [ $DIFF_HOURS -ge 48 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ 48h 无新提交（$DIFF_HOURS h），跳过本次定时构建"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ 最近 $DIFF_HOURS h 有提交，继续构建"
          fi

      - name: Exit if stagnant (schedule only)
        if: steps.stagnation.outputs.skip == 'true'
        run: exit 0

      - name: 安装 pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile extension
        run: pnpm run compile

      - name: Run lint
        run: pnpm run lint

      - name: Run tests (full gate)
        run: pnpm test

      - name: Package VSIX (nightly asset)
        id: package
        run: |
          pnpm run package
          # 产物固定命名
          VSIX=$(ls kode-*.vsix | head -1)
          cp "$VSIX" kode-nightly.vsix
          echo "vsix=kode-nightly.vsix" >> $GITHUB_OUTPUT
          echo "original=$VSIX" >> $GITHUB_OUTPUT

      - name: Prepare release metadata
        id: meta
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_URL="https://github.com/cuihairu/kode/commit/$(git rev-parse HEAD)"
          cat <<EOF > release-body.md
          # Kode Nightly Build

          **构建时间**：${BUILD_TIME}
          **Commit**：[${COMMIT_SHA}](${COMMIT_URL}) — ${COMMIT_MSG}
          **分支**：main

          ## 资产表
          | 文件 | 平台 | 说明 |
          |------|------|------|
          | kode-nightly.vsix | Windows / macOS / Linux (VS Code ≥1.50) | 通用 VSIX，下载后 `code --install-extension kode-nightly.vsix` 安装 |

          > ⚠️ 此为滚动 nightly 发布，**tag 恒为 \`nightly\`**，每次构建替换上一版资产与说明。仓库不带版本 tag，不发布到 Marketplace。
          EOF
          echo "body_path=release-body.md" >> $GITHUB_OUTPUT

      # 滚动发布:release 已存在则原位改标题/换说明/--clobber 替换资产,
      # 不存在则创建(恒为 nightly 滚动 tag,不带版本号)。用 gh CLI 而非
      # release action:action 在"既有 release 更新"路径上反复出现 403
      # 回归(softprops/action-gh-release#572/#836,权限声明齐备仍复发),
      # CLI 行为确定且 Verify 步本就依赖 gh。
      - name: Rolling release to tag 'nightly' (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VSIX="${{ steps.package.outputs.vsix }}"
          if gh release view nightly --repo cuihairu/kode >/dev/null 2>&1; then
            gh release edit nightly --repo cuihairu/kode \
              --title "Kode Nightly (rolling)" \
              --notes-file "${{ steps.meta.outputs.body_path }}" \
              --prerelease
            gh release upload nightly --repo cuihairu/kode "$VSIX" --clobber
          else
            gh release create nightly --repo cuihairu/kode \
              --title "Kode Nightly (rolling)" \
              --notes-file "${{ steps.meta.outputs.body_path }}" \
              --prerelease \
              --latest=false \
              "$VSIX"
          fi
          echo "✅ Release 'nightly' 已滚动更新:$VSIX"

      - name: Verify release asset exists
        run: |
          gh release view nightly --repo cuihairu/kode --json assets --jq '.assets[].name'
          echo "✅ Release 'nightly' 可见且含 kode-nightly.vsix"

  # 校验作业：确保无版本 tag 泄漏
  verify-no-version-tags:
    name: Verify no version tags
    runs-on: ubuntu-latest
    needs: build-and-release
    if: always() && needs.build-and-release.result == 'success'
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: List remote tags (exclude nightly)
        run: |
          git ls-remote --tags origin | grep -v 'refs/tags/nightly$' || true
          VERSION_TAGS=$(git ls-remote --tags origin | grep -v 'refs/tags/nightly$' | wc -l)
          if [ "$VERSION_TAGS" -gt 0 ]; then
            echo "❌ 发现版本 tag（nightly 除外），违反门禁"
            exit 1
          else
            echo "✅ 仅存在 nightly tag（滚动发布），无版本 tag 泄漏"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}