name: CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: write # 创建/更新 Release 与上传 vsix 需要（默认 token 为只读）
  id-token: write # codecov OIDC 免 token 上传覆盖率（2026-10-22）

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Checkout 代码
      timeout-minutes: 3
      uses: actions/checkout@v7.0.1

    - name: 安装 pnpm
      timeout-minutes: 10
      uses: pnpm/action-setup@v6.1.0
      # 2026-10-10:不再在此写 version,统一以 package.json 的 packageManager 为单一来源
      # (v6 会因两处版本并存直接报错:Multiple versions of pnpm specified)

    - name: 设置 Node.js ${{ matrix.node-version }}
      timeout-minutes: 5
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: 安装依赖
      timeout-minutes: 5
      run: pnpm install --frozen-lockfile

    - name: 编译 TypeScript
      timeout-minutes: 15
      run: pnpm run compile

    - name: 运行测试（带覆盖率）
      timeout-minutes: 12
      run: pnpm exec vitest run --coverage

    - name: 上传覆盖率到 Codecov（OIDC 免 token）
      timeout-minutes: 5
      uses: codecov/codecov-action@v7.1.1
      with:
        use_oidc: true
        files: ./coverage/lcov.info
        disable_search: true
        fail_ci_if_error: false

    - name: 运行代码检查
      timeout-minutes: 5
      run: pnpm run lint

    - name: 打包 VSIX 扩展
      timeout-minutes: 15
      # 先清 codecov-action 落在工作区的上传器（vscodeignore 已兜底，双保险）
      run: |
        rm -f codecov codecov.SHA256SUM codecov.SHA256SUM.sig
        pnpm run package

    - name: 上传 VSIX 文件
      timeout-minutes: 3
      uses: actions/upload-artifact@v7.0.2
      with:
        name: kode-vsix-${{ github.ref_name }}-${{ github.sha }}
        path: "kode-*.vsix"
        retention-days: 30

    - name: 创建 GitHub Release (Tag Push)
      timeout-minutes: 10
      # tag push 自动执行；也支持在 tag 上手动重触发（Run workflow 选 tag）
      # Marketplace 发布只有一条正道:publish.yml workflow_dispatch(版本一致性闸)。
      # 此前这里的 release:created 自动发 Marketplace 与 workflow_dispatch 裸发布
      # 两条腿均绕过该闸,已拆除(2026-10-24 季度复核,版本发布红线)。
      if: >-
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
      # 用 gh CLI 而非 softprops/action-gh-release：action 在「既有 release 更新」
      # 路径上反复 403（Resource not accessible by integration），权限声明齐备仍复发
      # —— 与 nightly.yml 采用同一做法（回归见 softprops/action-gh-release#572/#836）。
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        TAG="$GITHUB_REF_NAME"
        VSIX="$(ls -1 kode-*.vsix | head -1)"
        test -n "$VSIX"
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$VSIX" --clobber
        else
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Kode $TAG" --generate-notes "$VSIX"
        fi
        echo "== release 资产:"
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
          -q '.assets[] | "  \(.name)  \(.size) bytes"'
