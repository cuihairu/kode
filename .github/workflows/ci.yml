name: CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: write # 创建/更新 Release 与上传 vsix 需要（默认 token 为只读）
  id-token: write # codecov OIDC 免 token 上传覆盖率（2026-10-22）

# 同 ref 同事件的 run 合并为一组，新 run 抢占旧 run（缓解 runner 排队）；
# tag 发布（refs/tags/）不取消，保护 Release 上传不被超越 run 打断。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Checkout 代码
      timeout-minutes: 3
      uses: actions/checkout@v7.0.1

    - name: 安装 pnpm
      timeout-minutes: 10
      uses: pnpm/action-setup@v6.1.0
      # 2026-10-10:不再在此写 version,统一以 package.json 的 packageManager 为单一来源
      # (v6 会因两处版本并存直接报错:Multiple versions of pnpm specified)

    - name: 设置 Node.js ${{ matrix.node-version }}
      timeout-minutes: 5
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: 安装依赖
      timeout-minutes: 5
      run: pnpm install --frozen-lockfile
    # Rust 服务态门(P1-3 审计收口,2026-11-15):perf-gate 此前只跑 TS
    # v02Baseline,真实 kode-server 的服务面从未进合并门。第一方 cache 同
    # 覆盖率 job 口径(registry/git/target 跨 run 复用);工具链由
    # rust-toolchain.toml 钉死,rustup 首次调用自动安装。
    - name: Cache Rust builds (serving gate)
      timeout-minutes: 5
      uses: actions/cache@v4.2.4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-serving-gate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: rust-serving-gate-${{ runner.os }}-

    - name: Build kode-server
      timeout-minutes: 10
      run: cargo build -p kode-server

    - name: Serving gate (Rust faces vs loose bounds)
      # KODE_SERVING_GATE=1 才启用断言(缺省整套 skip,bench 目录整跑不重放);
      # KODE_SERVING_BOUND_* 可覆盖(servingBounds.ts 缺省=宽松上界,只捕
      # 数量级回退;spawn/mirror/steady/editRoundTrip/RSS 五面,任一超界即红)。
      timeout-minutes: 10
      run: |
        KODE_SERVING_GATE=1 \
        pnpm exec vitest run --config vitest.bench.config.ts tests/perf/servingGate.bench.ts

    - name: Serving soak (Rust steady mixed load, 60s tier)
      # Rust 服务态 soak(审计发现 soak 只挂 TS 侧):真实二进制稳态混合负载,
      # 闸=零错误+每窗有请求+RSS 增量在界+无数量级退化;60s 档守 PR 时长,
      # 更长档走 nightly(600s)。KODE_SERVING_SOAK_* 可调档。
      timeout-minutes: 10
      run: |
        pnpm exec vitest run --config vitest.bench.config.ts tests/perf/servingSoak.bench.ts


    - name: 编译 TypeScript
      timeout-minutes: 15
      run: pnpm run compile

    # 测试面板「运行」档用 /usr/bin/python3 -m pytest 真实执行;runner 系统
    # python3 默认无 pytest,缺则用例 0 passed/0 skipped 断言挂。装进该解释器
    # (Ubuntu 24.04 系统 python 标记 externally-managed,需 --break-system-packages)。
    - name: 安装 pytest(测试面板真实执行依赖)
      timeout-minutes: 5
      run: |
        /usr/bin/python3 -m pip install --user --break-system-packages --quiet pytest \
          || /usr/bin/python3 -m pip install --user --quiet pytest \
          || true
        /usr/bin/python3 -m pytest --version

    - name: 运行测试（带覆盖率）
      timeout-minutes: 12
      run: pnpm exec vitest run --coverage

    - name: 上传覆盖率到 Codecov（OIDC 免 token）
      timeout-minutes: 5
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        disable_search: true
        # VULN-KODE-R02:与 rust 侧对齐命名 flag,供 codecov.yml flag_management 归并
        flags: ts
        fail_ci_if_error: false

    - name: 运行代码检查
      timeout-minutes: 5
      run: pnpm run lint

    # mocha 烟测门(编译产物装配 + manifest 激活事件 + 状态栏灯位):pnpm test
    # 的后半段。此前 push CI 只跑 vitest,这段只在 nightly 触达——venv 席漏注册
    # 激活事件、状态栏灯位断言过时两类红都拖到次日才暴露。vitest 半段已在上面
    # 带覆盖率跑过,这里只补 mocha 半段;必须在打包步之前:vsce 的
    # vscode:prepublish 会用 esbuild bundle 覆盖 out/extension.js,而本门验的
    # 正是 tsc 产物的模块图。
    - name: 运行 mocha 烟测门(编译产物)
      timeout-minutes: 10
      run: |
        pnpm exec tsc -p tsconfig.mocha.json
        node ./out/test/runTest.js

    - name: 打包 VSIX 扩展
      timeout-minutes: 15
      # 先清 codecov-action 落在工作区的上传器（vscodeignore 已兜底，双保险）
      run: |
        rm -f codecov codecov.SHA256SUM codecov.SHA256SUM.sig
        pnpm run package

    - name: 上传 VSIX 文件
      timeout-minutes: 3
      uses: actions/upload-artifact@v7.0.2
      with:
        name: kode-vsix-${{ github.sha }}
        path: "kode-*.vsix"
        retention-days: 30

    - name: 创建 GitHub Release (Tag Push)
      timeout-minutes: 10
      # tag push 自动执行；也支持在 tag 上手动重触发（Run workflow 选 tag）
      # Marketplace 发布只有一条正道:publish.yml workflow_dispatch(版本一致性闸)。
      # 此前这里的 release:created 自动发 Marketplace 与 workflow_dispatch 裸发布
      # 两条腿均绕过该闸,已拆除(2026-10-24 季度复核,版本发布红线)。
      if: >-
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
      # 用 gh CLI 而非 softprops/action-gh-release：action 在「既有 release 更新」
      # 路径上反复 403（Resource not accessible by integration），权限声明齐备仍复发
      # —— 与 nightly.yml 采用同一做法（回归见 softprops/action-gh-release#572/#836）。
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        TAG="$GITHUB_REF_NAME"
        VSIX="$(ls -1 kode-*.vsix | head -1)"
        test -n "$VSIX"
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$VSIX" --clobber
        else
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Kode $TAG" --generate-notes "$VSIX"
        fi
        echo "== release 资产:"
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
          -q '.assets[] | "  \(.name)  \(.size) bytes"'

  # Rust core 覆盖率独立成 job（与 build 的 TS 覆盖率并存，互不覆盖），同时是
  # Rust 测试门禁的唯一执行点（本仓此前没有任何 workflow 跑过 cargo test）：
  # ① rustup 工具链下载 + cargo-llvm-cov 安装 + 全 workspace 插桩编译耗时长，
  #    放进 build 会挤占其 30 分钟预算并拖慢 TS 侧；
  # ② 同一 job 内步骤失败会跳过后续步骤，Rust 失败若落在 build 里会连带丢掉
  #    TS 的 codecov 上传；分 job 后两侧失败互不可见。
  # codecov 侧两份 lcov 各自上传到同一 commit，总览图与 README 徽章为两者合并值；
  # 本 job 附 flags: rust，只看 Rust 时在 Codecov 界面按 rust flag 过滤。
  rust-coverage:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40

    steps:
    - name: Checkout 代码
      timeout-minutes: 3
      uses: actions/checkout@v7.0.1

    # RUST-061 构建缓存:GitHub 第一方 cache(仓库口径「不引第三方 install
    # action」,缓存步同样走第一方),registry/git 下载与 target 编译产物跨
    # run 复用;Cargo.lock 变更经 key 失配全量重建,restore-keys 前缀命中做
    # 增量。缓存损坏/超限被逐出=回落冷构建(即本批前行为),不影响正确性。
    - name: Cache Rust builds (cargo registry + target)
      timeout-minutes: 5
      uses: actions/cache@v4.2.4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-coverage-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: rust-coverage-${{ runner.os }}-

    # 工具链版本由 rust-toolchain.toml 钉死（1.99.0），rustup 进入该目录后
    # 首次调用自动安装；llvm-tools-preview 提供 llvm-profdata/llvm-cov，
    # 是 cargo-llvm-cov 采集 profraw→lcov 的必需组件。
    - name: 安装 Rust 工具链组件（llvm-tools-preview）
      timeout-minutes: 10
      run: |
        rustup component add llvm-tools-preview
        rustc --version
        cargo --version

    - name: 安装 cargo-llvm-cov
      timeout-minutes: 10
      # 不引第三方 install action：cargo install 走 crates.io，供应链面最小
      run: cargo install cargo-llvm-cov --locked

    - name: 运行 Rust 测试并生成覆盖率（全 workspace，唯一执行点）
      timeout-minutes: 25
      # 门禁口径 = cargo test --workspace --all-targets --no-fail-fast（QA 计划批0 的实测口径）：
      # cargo-llvm-cov 把这些 flag 原样透传给 cargo test，只额外加插桩；--all-targets 覆盖
      # lib/bins/tests/examples/benches 的 test 目标（不含 doctest；本仓 6a2e005 实测 77 个
      # 测试二进制 / 453 passed / 0 failed），--no-fail-fast 让失败也跑完全部目标再报。
      # 测试失败 → 本步退出码 101（实测，探针用例验证）→ job 红；不加 --ignore-run-fail
      # （它会把失败吞成 0）、不加 continue-on-error。Rust 测试全仓只在此执行一次，
      # 不另设测试 job，避免插桩与非插桩两套编译重复跑同一批测试。
      run: |

        mkdir -p coverage/rust

        cargo llvm-cov --workspace --all-targets --no-fail-fast --lcov --output-path coverage/rust/lcov.info

    - name: 上传 Rust 覆盖率到 Codecov（OIDC 免 token）
      timeout-minutes: 5
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/rust/lcov.info
        flags: rust
        disable_search: true
        fail_ci_if_error: false

    # PDC-0606:clippy 门禁此前不在任何 workflow(本地手跑才拦),Rust 测试门禁
    # 只 cover cargo test。clippy 组件由 rust-toolchain.toml 声明(rustup 首次
    # 调用即装),无需额外 install。放在覆盖率上传之后:clippy 失败仍让 job 红
    # (门禁生效),但已上传的覆盖率不因 clippy 步失败而丢失。口径与本地门禁
    # 一致:--workspace --all-targets -D warnings。
    - name: 运行 Rust clippy（-D warnings 门禁）
      timeout-minutes: 10
      run: cargo clippy --workspace --all-targets -- -D warnings

  # RUST-028(旧 PERF-011)PR 对比闸:每个 PR 跑与 nightly 发布门同一套 bench
  # (KODE_PERF_GATE=1),档位取 M(2,000 文件)控制 PR 时长;断言的是
  # docs/perf/2026-11-04-v02-baseline.md 推导的宽松上界(gateBounds.ts,
  # 只捕数量级回退,CI runner 实测绿),不是跨机器绝对值对比(PERF-015 禁)。
  # 本 job 红=基准不过=合并阻塞面;要强制化,请在仓库 Settings→Branches→
  # protection 把「CI/CD / perf-gate」加入 required status checks(仓库设置
  # 属主侧操作,workflow 文件无法代设)。
  perf-gate:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
    - name: Checkout 代码
      timeout-minutes: 3
      uses: actions/checkout@v7.0.1

    - name: 安装 pnpm
      timeout-minutes: 10
      uses: pnpm/action-setup@v6.1.0
      # 与 build/nightly 同源:version 由 package.json packageManager 单一来源

    - name: 设置 Node.js
      timeout-minutes: 5
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: 安装依赖
      timeout-minutes: 5
      run: pnpm install --frozen-lockfile

    # bench 直跑 TS(vitest 自转换),无需 compile;资产按档生成到 tmp 后清理。
    - name: Perf gate (PR comparison against baseline bounds)
      timeout-minutes: 15
      run: |
        KODE_PERF_GATE=1 KODE_PERF_LARGE_FILES=2000 \
        KODE_PERF_BASELINE_JSON_OUT=docs/perf/perf-baseline-snapshot.json \
        pnpm exec vitest run --config vitest.bench.config.ts tests/perf/v02Baseline.bench.ts

    # 门红也要把运行文件/快照传出来供归因(if: always())
    - name: Upload perf run file and snapshot
      if: always()
      timeout-minutes: 3
      uses: actions/upload-artifact@v7.0.2
      with:
        name: perf-pr-run
        path: |
          docs/perf/v02-baseline-run.txt
          docs/perf/perf-baseline-snapshot.json
          docs/perf/serving-gate-run.txt
          docs/perf/serving-soak-run.txt
        if-no-files-found: warn
        retention-days: 30

  # RUST-083(旧 CORE-018)调度器长期压力车道:确定性随机混合负载下断言
  # kode-scheduler 调度核结构不变量(死锁/永久 pending/计数守恒/取消泄漏/
  # 内存无界/keyed 假 pending),任一破坏即 job 红。检测面与 cargo test
  # (crates/kode-scheduler/tests/stress_units.rs,小规模默认门)同源;此处
  # 为 release 长跑。随机源按 --seed 固定,失败可原样回放。
  scheduler-stress:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
    - name: Checkout 代码
      timeout-minutes: 3
      uses: actions/checkout@v7.0.1

    - name: Cache Rust builds (cargo registry + target)
      timeout-minutes: 5
      uses: actions/cache@v4.2.4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: scheduler-stress-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: scheduler-stress-${{ runner.os }}-

    - name: 运行调度器压力长跑（release）
      timeout-minutes: 10
      run: cargo run --release -p kode-scheduler --bin kode-scheduler-stress -- --ops 500000 --check-every 5000
