name: Publish to Marketplace

# A version is explicitly supplied and must already be committed in package.json.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching package.json (for example 0.2.0)'
        required: true
        type: string
      publish:
        description: 'Publish to Marketplace after validation (false only validates)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kode-marketplace-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and full regression
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check publisher and requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p=require("./package.json"); const v=process.env.REQUESTED_VERSION.replace(/^[vV]/, ""); if(p.publisher!=="cuihairu" || v!==p.version) { console.error("Publisher or requested version does not match package.json"); process.exit(1); }'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile
      - run: pnpm run lint
      - name: Install pytest for test panel checks
        run: |
          /usr/bin/python3 -m pip install --user --break-system-packages --quiet pytest \
            || /usr/bin/python3 -m pip install --user --quiet pytest \
            || true
          /usr/bin/python3 -m pytest --version
      - name: Run full tests
        run: |
          pnpm exec vitest run --maxWorkers=1
          pnpm clean
          pnpm compile
          pnpm exec tsc -p tsconfig.mocha.json
          node ./out/test/runTest.js

  packages:
    name: Build and verify seven packages
    uses: ./.github/workflows/platform-vsix.yml
    permissions:
      contents: read

  prepare:
    name: Verify complete package set
    needs: [validate, packages]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-vsix-*
          path: dist
          merge-multiple: true
      - run: node scripts/verify-platform-set.mjs dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: marketplace-verified-${{ github.sha }}
          path: |
            dist/*.vsix
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified packages to Marketplace
    needs: prepare
    if: inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-verified-${{ github.sha }}
          path: dist
      - name: Verify downloaded package set
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          node scripts/verify-platform-set.mjs dist
      - name: Publish six platform packages and universal fallback
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT"
          pnpm exec vsce publish --no-dependencies --packagePath dist/*.vsix
