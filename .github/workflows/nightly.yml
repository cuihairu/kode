name: Daily Build (nightly)

on:
  schedule:
    # 离峰非整点：每天 03:17 UTC（北京时间 11:17），避开 GitHub Actions 高峰
    - cron: '17 3 * * *'
  workflow_dispatch: # 手动触发必建

permissions:
  contents: write # 创建/更新 Release 需要

concurrency:
  group: kode-nightly-release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether nightly is needed
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'workflow_dispatch' || github.repository == 'cuihairu/kode'
    outputs:
      skip: ${{ steps.stagnation.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # 需要完整历史做 48h 判断与 commit 信息

      # 48h 停滞门：仅对 schedule 生效；workflow_dispatch 跳过检查必建
      - name: Stagnation gate (48h no new commits on default branch → skip)
        if: github.event_name == 'schedule'
        id: stagnation
        run: |
          # 取默认分支最近一次提交时间（UNIX 秒）
          LATEST=$(git log -1 --format=%ct origin/main)
          NOW=$(date +%s)
          DIFF_HOURS=$(( (NOW - LATEST) / 3600 ))
          echo "latest_commit_ts=$LATEST" >> "$GITHUB_OUTPUT"
          echo "diff_hours=$DIFF_HOURS" >> "$GITHUB_OUTPUT"
          if [ "$DIFF_HOURS" -ge 48 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ 48h 无新提交（$DIFF_HOURS h），跳过本次定时构建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ 最近 $DIFF_HOURS h 有提交，继续构建"
          fi

  validate:
    name: Existing full correctness gate
    timeout-minutes: 75
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 安装 pnpm
        timeout-minutes: 10
        uses: pnpm/action-setup@v6.1.0
        # 2026-10-10:不写 version,统一由 package.json packageManager 决定
        # (v6 见两处版本并存会直接报 Multiple versions of pnpm specified)

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile extension
        run: pnpm run compile

      - name: Run lint
        run: pnpm run lint

      # 测试面板「运行」档用 /usr/bin/python3 -m pytest 真实执行;runner 系统
      # python3 默认无 pytest,缺则用例 0 passed/0 skipped 断言挂(与 ci.yml
      # 同源)。装进该解释器(Ubuntu 24.04 系统 python 标记
      # externally-managed,需 --break-system-packages);装不上则版本探测
      # 直接红,不让测试用 0 结果断言的模糊失败掩盖环境问题。
      - name: Install pytest (test panel real execution dependency)
        timeout-minutes: 5
        run: |
          /usr/bin/python3 -m pip install --user --break-system-packages --quiet pytest \
            || /usr/bin/python3 -m pip install --user --quiet pytest \
            || true
          /usr/bin/python3 -m pytest --version

      - name: Run tests (full gate)
        # The suite contains wall-clock slice budgets. Run every test without
        # competing test workers; keep the same limits, with no retries/skips.
        run: |
          pnpm exec vitest run --maxWorkers=1
          pnpm clean
          pnpm compile
          pnpm exec tsc -p tsconfig.mocha.json
          node ./out/test/runTest.js

      - name: Perf gate (memory ceiling + tail latency + startup walls)
        # RUST-007 release gate: same bench as the 2026-11-04 baseline, with
        # KODE_PERF_GATE=1 asserting loose ceilings (order-of-magnitude
        # regressions only; RSS bounds are the tight ones at ~2.4-3x because
        # memory does not jitter like wall clock on shared runners).
        # RUST-027: thresholds overridable via KODE_PERF_BOUND_* (defaults =
        # loose ceilings in tests/perf/gateBounds.ts); the raw metric run file
        # is uploaded below as the nightly baseline report.
        # RUST-028: KODE_PERF_BASELINE_JSON_OUT additionally emits a
        # machine-readable snapshot (schema kode-perf-baseline/1) of the same
        # run; uploaded below with 90-day retention as the trend series.
        run: |
          KODE_PERF_GATE=1 KODE_PERF_LARGE_FILES=30000 \
          KODE_PERF_BASELINE_JSON_OUT=docs/perf/perf-baseline-snapshot.json \
          pnpm exec vitest run --config vitest.bench.config.ts tests/perf/v02Baseline.bench.ts

      # 第一方 cache 与 ci.yml 覆盖率 job 同口径;工具链 rust-toolchain.toml
      # 钉死,rustup 首次调用自动安装(runner 预装 rustup)。
      - name: Cache Rust builds (serving gate)
        timeout-minutes: 5
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-serving-gate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-serving-gate-${{ runner.os }}-

      - name: Build kode-server
        timeout-minutes: 10
        run: cargo build -p kode-server


      - name: Serving gate (Rust faces vs loose bounds)
        # Rust 服务态发布门(2026-11-15 P1-3 审计收口):真实 kode-server 五面
        # (spawn/mirror/steady/editRoundTrip/RSS)按 servingBounds.ts 宽松上界
        # 断言,KODE_SERVING_BOUND_* 可覆盖;与 perf-gate(PR 门)同套界。
        timeout-minutes: 10
        run: |
          KODE_SERVING_GATE=1 \
          pnpm exec vitest run --config vitest.bench.config.ts tests/perf/servingGate.bench.ts

      - name: Serving soak (Rust steady mixed load, 600s nightly tier)
        # Rust 服务态长跑档(PR 门 60s,发布门 600s=10x),闸=零错误+每窗有
        # 请求+RSS 增量在界+无数量级退化;运行文件下方上传留档。
        timeout-minutes: 15
        run: |
          KODE_SERVING_SOAK_SECONDS=600 \
          pnpm exec vitest run --config vitest.bench.config.ts tests/perf/servingSoak.bench.ts

      - name: Upload serving gate and soak run files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: serving-run-files
          path: |
            docs/perf/serving-gate-run.txt
            docs/perf/serving-soak-run.txt
          if-no-files-found: warn
          retention-days: 30


      - name: Upload perf baseline run file
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perf-baseline-run
          path: docs/perf/v02-baseline-run.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload perf baseline snapshot (machine-readable)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perf-baseline-snapshot
          path: docs/perf/perf-baseline-snapshot.json
          if-no-files-found: warn
          retention-days: 90

  packages:
    name: Native platform packages
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    uses: ./.github/workflows/platform-vsix.yml
    permissions:
      contents: read

  # PA-006 Wireshark 插件(GPL-3.0-or-later,独立于 Apache VSIX 分发面,
  # 许可边界见 plugins/wireshark-kbengine/Cargo.toml)。设计文档跨系统矩阵:
  # 「构建矩阵=OS×Wireshark 版本,nightly 每日构建面覆盖主版本线即可」——
  # 本 job 即该面。ABI 声明随构建宿主 Wireshark 版本探测(libwireshark
  # WANT_MAJOR/MINOR=sys VERSION),故两腿都锁 4.6 主版本线。验收门=
  # 装→验→删闭环(tshark -G plugins 列出 + 样例 pcap -Y kbengine 6/6),
  # 不过不上传 artifact。产物先挂 artifact;2026-11-25 用户拍板挂进 nightly
  # 滚动 Release(build-and-release 在腿绿时打包上传,腿红如实缺位并在
  # release 说明注明,不卡七包面)。Wireshark 依赖重,走 GitHub
  # 托管 runner,不吃 CI_RUNNER 自托管路由。
  wireshark-plugin:
    name: Wireshark plugin (${{ matrix.artifact }})
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wireshark-plugin-linux-x64
            bin: libwireshark_kbengine.so
          - os: windows-latest
            artifact: wireshark-plugin-windows-x64
            bin: wireshark_kbengine.dll
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/wireshark-kbengine
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Wireshark 4.6 宿主:版本探测决定产物 ABI,锁主版本线,拿不到就红。
      - name: Install Wireshark 4.6 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          # libwireshark-dev 提供 libwireshark.so dev symlink(build.rs 只探无版本
          # 后缀路径;只装 tshark 得到的是 libwireshark.so.19,链不上)。
          sudo apt-get install -y --no-install-recommends tshark libwireshark-dev
          tshark -v | head -1
          tshark -v | grep -E 'Wireshark\) 4\.6\.' || { echo 'expected Wireshark 4.6 line on runner'; exit 1; }
      - name: Install Wireshark 4.6.4 (Windows)
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://2.na.dl.wireshark.org/win64/all-versions/Wireshark-4.6.4-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ws-installer.exe"
          # MZ 头校验:站点对缺失文件返回 200+HTML 404 页,不校验会把 HTML
          # 当安装器静默装失败(首跑实犯,判例)。
          $bytes = [System.IO.File]::ReadAllBytes("$env:RUNNER_TEMP\ws-installer.exe")[0..1]
          if ([System.Text.Encoding]::ASCII.GetString($bytes) -ne 'MZ') { Write-Host 'downloaded file is not a PE binary'; exit 1 }
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\ws-installer.exe" -ArgumentList '/S'
          & 'C:\Program Files\Wireshark\tshark.exe' -v | Select-Object -First 1
          if (-not (& 'C:\Program Files\Wireshark\tshark.exe' -v | Select-String 'Wireshark\) 4\.6\.')) { Write-Host 'expected Wireshark 4.6 line on runner'; exit 1 }
      # Windows 导入库生成路径(libwireshark-sys 用 llvm-readobj 从 DLL 导出表
      # 生成 .lib);windows-latest 带 LLVM,拿不到就 choco 兜底。
      - name: Ensure llvm-readobj (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command llvm-readobj -ErrorAction SilentlyContinue)) { choco install -y llvm }
          llvm-readobj --version | Select-Object -First 1

      # 构建:rust-toolchain.toml pin 随目录树上溯生效;clippy 门与本地口径一致。
      - name: Build plugin (release)
        run: cargo build --release
      - name: Clippy gate
        run: cargo clippy --all-targets -- --deny warnings

      # 装→验→删闭环(验收门):装载列出 + 样例 pcap 6/6 命中,不过即红、
      # 不上传。pcap 复制到临时目录再读(实证口径:绕开宿主对仓库路径的
      # 读取限制)。Linux 装全局 epan 目录(设计文档:AppArmor 拦个人目录)。
      - name: Load acceptance (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          EPAN="$(tshark -G folders | grep -i 'Global Plugins' | tr -d '\t' | sed 's/.*: *//')/epan"
          sudo mkdir -p "$EPAN"
          sudo cp "target/release/${{ matrix.bin }}" "$EPAN/"
          tshark -G plugins | grep -i kbengine
          cp ../../docs/samples/kbengine-wire-samples/kbengine-login-flow.pcap /tmp/kbe-login.pcap
          HITS="$(tshark -r /tmp/kbe-login.pcap -o kbengine.loginapp_port:2001 -Y kbengine | wc -l)"
          echo "kbengine frames: $HITS"
          test "$HITS" -eq 6
          sudo rm "$EPAN/libwireshark_kbengine.so"
      - name: Load acceptance (Windows)
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $epan = Join-Path $env:APPDATA 'Wireshark\plugins\4.6\epan'
          New-Item -ItemType Directory -Force -Path $epan | Out-Null
          Copy-Item "target\release\${{ matrix.bin }}" $epan
          & 'C:\Program Files\Wireshark\tshark.exe' -G plugins | Select-String kbengine
          Copy-Item ..\..\docs\samples\kbengine-wire-samples\kbengine-login-flow.pcap "$env:TEMP\kbe-login.pcap"
          $hits = (& 'C:\Program Files\Wireshark\tshark.exe' -r "$env:TEMP\kbe-login.pcap" -o kbengine.loginapp_port:2001 -Y kbengine | Measure-Object -Line).Lines
          Write-Host "kbengine frames: $hits"
          if ($hits -ne 6) { exit 1 }
          Remove-Item (Join-Path $epan 'wireshark_kbengine.dll')

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            plugins/wireshark-kbengine/target/release/${{ matrix.bin }}
            plugins/wireshark-kbengine/README.md
          if-no-files-found: error
          retention-days: 90

  build-and-release:
    name: Publish nightly after all seven packages pass
    # needs 含 wireshark-plugin 只为读 needs.*.result 控制插件资产面;
    # if 用 always() + 两主面显式 success:插件腿红不卡七包滚动发布,
    # 插件资产如实缺位并在 release 说明注明(2026-11-25 用户拍板形态)。
    needs: [validate, packages, wireshark-plugin]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.packages.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Download verified platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: platform-vsix-*
          path: dist
          merge-multiple: true
      # 插件资产挂进 nightly release(2026-11-25 用户拍板):腿绿(含装→验→
      # 删验收门 6/6)才下载打包上传;腿红则缺位并在 release 说明注明,不卡
      # 七包面。zip 内带 README.md(安装目录表 + AppArmor 加固注意)。
      - name: Download Wireshark plugin artifacts
        if: needs.wireshark-plugin.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: wireshark-plugin-*
          path: dist/plugin
      - name: Package Wireshark plugin assets
        if: needs.wireshark-plugin.result == 'success'
        run: |
          set -euo pipefail
          mkdir -p dist/plugin-zip
          for d in dist/plugin/wireshark-plugin-*; do
            [ -d "$d" ] || continue
            os="${d##*/wireshark-plugin-}"
            stage="dist/plugin-stage/wireshark-kbengine-plugin-$os"
            mkdir -p "$stage"
            find "$d" -type f \( -name '*.so' -o -name '*.dll' \) -exec cp {} "$stage/" \;
            find "$d" -type f -name 'README.md' -exec cp {} "$stage/" \;
            [ -n "$(find "$stage" \( -name '*.so' -o -name '*.dll' \) -print -quit)" ] || { echo "no plugin binary staged for $os"; exit 1; }
            (cd dist/plugin-stage && zip -qr "../plugin-zip/wireshark-kbengine-plugin-$os.zip" "wireshark-kbengine-plugin-$os")
          done
          ls -l dist/plugin-zip/
      - name: Verify all seven packages and generate checksums
        run: node scripts/verify-platform-set.mjs dist

      # RUST-060 第二增量:发布二进制的 CycloneDX 1.5 SBOM(依赖闭包全清单,
      # 含 crate 名/版本/purl/SPDX license),与 SHA256SUMS 同面进滚动 release
      # 资产。三发布二进制=kode-server/kode-kbengine/kode-mcp(与 bin/manifest
      # 校验面同集);dump-* golden 工具不发布不生成。cargo-cyclonedx 版本钉
      # 死与本地验证同款;rust-toolchain.toml 钉的链 rustup 首调自动装。
      - name: Generate CycloneDX SBOMs for released binaries (RUST-060)
        timeout-minutes: 10
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.10
          cargo cyclonedx -f json --describe binaries --spec-version 1.5 -q
          mkdir -p dist/sbom
          cp crates/kode-server/kode-server_bin.cdx.json dist/sbom/kode-server.cdx.json
          cp crates/kode-kbengine/kode-kbengine_bin.cdx.json dist/sbom/kode-kbengine.cdx.json
          cp crates/kode-mcp/kode-mcp_bin.cdx.json dist/sbom/kode-mcp.cdx.json

      - name: Prepare release metadata
        id: meta
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_URL="https://github.com/cuihairu/kode/commit/$(git rev-parse HEAD)"
          # 插件资产行:zip 在=验收过挂出;zip 缺(腿红)=如实注明缺位。
          if compgen -G "dist/plugin-zip/*.zip" > /dev/null; then
            PLUGIN_ROWS='| wireshark-kbengine-plugin-linux-x64.zip / wireshark-kbengine-plugin-windows-x64.zip | Linux / Windows（Wireshark 4.6） | KBEngine 线协议 Wireshark dissector 插件（GPL-3.0-or-later 独立许可，不随 VSIX 分发）；已过装→验→删验收门（tshark 装载列出 + 样例 pcap 6/6 命中），zip 内 README 含安装目录表 |'
          else
            PLUGIN_ROWS='| （Wireshark 插件资产） | Linux / Windows | 本夜插件构建未过验收门，资产缺位；见 wireshark-plugin job 日志 |'
          fi
          cat <<EOF > release-body.md
          # Kode Nightly Build

          **构建时间**：${BUILD_TIME}
          **Commit**：[${COMMIT_SHA}](${COMMIT_URL}) — ${COMMIT_MSG}
          **分支**：main

          ## 资产表
          | 文件 | 平台 | 说明 |
          |------|------|------|
          | kode-*-win32-x64.vsix / win32-arm64.vsix | Windows x64 / ARM64 | 含 Rust 后台与协议 CLI |
          | kode-*-darwin-x64.vsix / darwin-arm64.vsix | macOS Intel / Apple Silicon | 含 Rust 后台与协议 CLI |
          | kode-*-linux-x64.vsix / linux-arm64.vsix | Linux x64 / ARM64 | musl 静态目标，含 Rust 后台与协议 CLI |
          | kode-*-pure-ts.vsix | 通用纯 TS | 无二进制，默认 TS 后端；Rust 独有工具能力受限 |
          | SHA256SUMS | 全平台 | 下载完整性校验 |
          | sbom/*.cdx.json | Rust 二进制 | kode-server/kode-kbengine/kode-mcp 的 CycloneDX 1.5 依赖清单（RUST-060 来源审计） |
          ${PLUGIN_ROWS}

          每个平台均通过原生 Rust 单元测试、CLI 集成测试、二进制发现测试，
          并从最终 VSIX 解出二进制完成 LSP 生命周期与 CLI 启动验证。
          六个平台和纯 TS 包全部成功才更新 nightly。VS Code 最低版本以包内 engines.vscode 为准。

          > ⚠️ 此为滚动 nightly 发布，**tag 恒为 \`nightly\`**，每次构建替换上一版资产与说明。仓库不带版本 tag，不发布到 Marketplace。
          EOF
          echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"

      # 滚动发布:release 已存在则原位改标题/换说明/--clobber 替换资产,
      # 不存在则创建(恒为 nightly 滚动 tag,不带版本号)。用 gh CLI 而非
      # release action:action 在"既有 release 更新"路径上反复出现 403
      # 回归(softprops/action-gh-release#572/#836,权限声明齐备仍复发),
      # CLI 行为确定且 Verify 步本就依赖 gh。
      - name: Rolling release to tag 'nightly' (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(dist/*.vsix dist/SHA256SUMS dist/sbom/*.cdx.json)
          for plugin_zip in dist/plugin-zip/*.zip; do
            if [ -e "$plugin_zip" ]; then ASSETS+=("$plugin_zip"); fi
          done
          if gh release view nightly --repo cuihairu/kode >/dev/null 2>&1; then
            gh release edit nightly --repo cuihairu/kode \
              --title "Kode Nightly (rolling)" \
              --notes-file "${{ steps.meta.outputs.body_path }}" \
              --prerelease
            gh release upload nightly --repo cuihairu/kode "${ASSETS[@]}" --clobber
          else
            gh release create nightly --repo cuihairu/kode \
              --title "Kode Nightly (rolling)" \
              --notes-file "${{ steps.meta.outputs.body_path }}" \
              --prerelease \
              --latest=false \
              "${ASSETS[@]}"
          fi
          echo "✅ 全平台通过后，Release nightly 已滚动更新"

      - name: Verify release asset exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh CLI 只认 GH_TOKEN
        run: |
          gh release view nightly --repo cuihairu/kode --json assets --jq '.assets[].name'
          gh release view nightly --repo cuihairu/kode --json assets > /tmp/kode-nightly-assets.json
          node scripts/verify-platform-set.mjs dist /tmp/kode-nightly-assets.json

      - name: Remove superseded VSIX assets after the new set is verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r asset; do
            if [[ "$asset" == kode-*.vsix ]] && [ ! -f "dist/$asset" ]; then
              gh release delete-asset nightly "$asset" --repo cuihairu/kode --yes
            fi
            # 插件 zip 缺位夜(腿红)要撤上一夜的旧插件 zip:release 资产集
            # 与本 commit 构建对齐,不留过时资产(body 说明同步注明缺位)。
            if [[ "$asset" == wireshark-kbengine-plugin-*.zip ]] && [ ! -f "dist/plugin-zip/$asset" ]; then
              gh release delete-asset nightly "$asset" --repo cuihairu/kode --yes
            fi
          done < <(gh release view nightly --repo cuihairu/kode --json assets --jq '.assets[].name')

  # 校验作业：确保无版本 tag 泄漏
  verify-no-version-tags:
    name: Verify no version tags
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: build-and-release
    if: always() && needs.build-and-release.result == 'success'
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Version tags must correspond to published releases
        # 2026-10-19 调整：原规则「不许存在任何版本 tag」在用户正式发版 v0.1.0 后永久失败，
        # 拦掉了每日构建。改为：版本 tag 可以存在，但必须对应一个已发布的 GitHub Release；
        # 有 tag 无 Release = 疑似误推，仍拦。nightly 滚动 tag 不计。
        run: |
          set -uo pipefail
          git ls-remote --tags origin | grep -v 'refs/tags/nightly$' || true
          TAGS=$(git ls-remote --tags origin | grep -v 'refs/tags/nightly$' | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}' || true)
          if [ -z "$TAGS" ]; then
            echo "✅ 仅存在 nightly tag（滚动发布），无版本 tag"
            exit 0
          fi
          BAD=""
          for t in $TAGS; do
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "  ✅ $t → 已发布 Release"
            else
              echo "  ❌ $t → 无对应 Release（疑似误推）"
              BAD="$BAD $t"
            fi
          done
          if [ -n "$BAD" ]; then
            echo "❌ 违反门禁：存在未发布的版本 tag:$BAD"
            echo "   若确为有意发布的 tag，请先创建对应 GitHub Release；临时放行会破坏每日构建门禁。"
            exit 1
          fi
          echo "✅ 所有版本 tag 均有对应 Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
