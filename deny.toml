# cargo-deny 配置（RUST-060 第二增量,2026-11-20 coverage 任务书 P1 清扫）
# 检查面=advisories(已知漏洞 RUSTSEC)+licenses(白名单);bans/sources 不开
# (多版本/来源检查噪音大,超出本批审计面)。
# CI:ci.yml cargo-deny job;本地:cargo deny --workspace check advisories licenses

[advisories]
version = 2
# yanked 依赖一律拒绝(默认);漏洞无 fix 也红(dev 期自己拆)
# unmaintained 只查 workspace 直接依赖(0.22 默认,显式钉死防默认漂移):
# 传递依赖的 unmaintained 不拦——RUSTSEC-2026-0543(chrono 全线停维)与
# RUSTSEC-2026-0440(astral-tokio-tar 停维)均经 rmcp 传递引入,kode 零
# 直接依赖,上游生态仍在用;kode 若将来直接依赖即红。vulnerability 类
# 告警不受此键影响,传递面照查。
unmaintained = "workspace"

[licenses]
version = 2
# 白名单=2026-11-20 干净全量 cargo deny list 实测 14 宽松族:
# Apache-2.0(229 crate)/MIT/BSD-2/3/ISC/Zlib/Unlicense/Apache-2.0 WITH
# LLVM-exception/MPL-2.0/BSL-1.0/CC0-1.0/MIT-0/Unicode-3.0/Unicode-DFS-2016。
# 新依赖带白名单外 license(如新 GPL)→红,人工审后扩表或例外。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# r-efi=LGPL-2.1-or-later(UEFI 常量表),仅作为 getrandom/rustix 的
# cfg(target_os="uefi") 依赖存在,三个发布平台(win/darwin/linux)不链接,
# 产物无 copyleft 面;白名单不收 LGPL,新 LGPL 依赖仍会红。
exceptions = [{ crate = "r-efi", allow = ["LGPL-2.1-or-later"] }]
