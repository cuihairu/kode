<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1620" viewBox="0 0 1280 1620" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Kode · Architecture</title>
<desc id="desc">Kode is a VS Code extension for KBEngine. The VS Code extension host (TypeScript, src/ compiled to out/) carries all language providers, panels/WebViews, the data plane, the index plane and server integration; the Rust Core (kode-server binary) is the language server of the kode2 migration, dual-track switched with the extension host over stdio LSP frames (shadow parity). Dashed edges are control/configuration, solid edges are business data. The diagram reflects the current implementation facts, not everything implemented.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c2410c"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker></defs>
