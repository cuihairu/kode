<text x="675" y="424" class="body" text-anchor="start">Entity explorer · Server control · Logs · Monitoring</text>
<text x="675" y="444" class="body" text-anchor="start">Telnet · Dependency graph · Codegen wizard · Quick actions</text>
<text x="675" y="464" class="body" text-anchor="start">DB simulation / drift · Hot-reload log · Runtime query</text>
<text x="675" y="484" class="body" text-anchor="start">webview standalone bundle (media/*, defCallChainViewer)</text>
</g>

<!-- R4 data plane -->
<g id="data-plane" data-node="data-plane"><rect x="60" y="520" width="1160" height="98" rx="12" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="80" y="546" class="name" text-anchor="start">Data plane</text>
<text x="80" y="572" class="body" text-anchor="start">DocumentStore (snapshot + same-version single parse) · SemanticIndex (entity / type / symbol queries) · SemanticDependencyGraph (dependency invalidation, fullRebuild=false)</text>
<text x="80" y="596" class="body" text-anchor="start">IndexScheduler (priority + interactive cooldown + task merge + failure recovery) · DiagnosticScheduler (version token · latest wins · layered accounting)</text>
</g>

<!-- R5 index plane -->
<g id="index-plane" data-node="index-plane"><rect x="60" y="632" width="1160" height="98" rx="12" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="80" y="658" class="name" text-anchor="start">Index plane</text>
<text x="80" y="684" class="body" text-anchor="start">EntityMappingManager (.def / entities.xml / types.xml / alias.xml mapping) · PythonClassIndex (classes / bases / methods / MRO / composition roots, five axes)</text>
<text x="80" y="708" class="body" text-anchor="start">WorkspaceIndex (local symbol index) · ScanRoots (cross-root + external-root file discovery · result cache) · multi-root lookup order rules</text>
</g>

<!-- R6 server integration -->
<g id="server-integration" data-node="server-integration"><rect x="60" y="744" width="565" height="200" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
