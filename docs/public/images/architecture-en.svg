<text x="80" y="796" class="body" text-anchor="start">serverManager · processManager</text>
<text x="80" y="818" class="body" text-anchor="start">spawn child process · process table · SIGTERM→SIGKILL</text>
<text x="80" y="842" class="body" text-anchor="start">telnetClient (probe + session) · telnetService (5s low frequency)</text>
<text x="80" y="866" class="body" text-anchor="start">logHub (TCP log collection + sha256 dedup) · logger port</text>
<text x="80" y="890" class="body" text-anchor="start">httpRequestService (outbound quick requests, 10s timeout)</text>
<text x="80" y="914" class="body" text-anchor="start">kbengineMetadata · engineCompatibility</text>
</g>

