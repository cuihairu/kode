<text x="80" y="354" class="body" text-anchor="start">activeProfile · rootConfigGeneration · kbengineMetadata · kbengine.jsoncAssociation (JSONC association) · 65 kbengine.* settings · debug.json schema validation</text>
</g>

<!-- R3 language providers -->
