<text x="40" y="46" class="title" text-anchor="start">Kode · Architecture</text>
<text x="40" y="78" class="body" text-anchor="start">VS Code extension host (TypeScript) + Rust Core (kode-server) · for KBEngine projects · bilingual docs site</text>

<!-- Top: VS Code editor context -->
