</g>

<!-- Extension host container -->
<g id="extension-host" data-node="extension-host"><rect x="40" y="184" width="1200" height="800" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="60" y="216" class="name" text-anchor="start" style="fill:#3730a3">VS Code Extension Host · TypeScript (src/ → out/extension.js)</text>
<text x="1220" y="216" class="small" text-anchor="end">composition root extension.ts · 89 commands · 65 kbengine.* settings</text>

<!-- R1 activation -->
<g id="activation" data-node="activation"><rect x="60" y="228" width="1160" height="70" rx="12" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="80" y="252" class="name" text-anchor="start">Activation entry · extension.ts (composition root)</text>
<text x="80" y="280" class="body" text-anchor="start">Single activate() · instantiates IndexScheduler / EntityMappingManager / PythonClassIndex · registers all providers (completion / hover / definition / CodeLens / InlayHints)</text>
</g>

<!-- R2 config -->
