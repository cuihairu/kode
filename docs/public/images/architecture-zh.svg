<g id="kbengine-server" data-node="kbengine-server"><rect x="650" y="1300" width="590" height="200" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="670" y="1330" class="name" text-anchor="start">KBEngine 服务器组件</text>
<text x="670" y="1358" class="body" text-anchor="start">start/stop 10 组件 · 进程 PID · 状态栏计数</text>
