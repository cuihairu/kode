<g data-node="kode-protocol"><rect x="200" y="1182" width="280" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="220" y="1206" class="crate" text-anchor="start">kode-protocol</text><text x="220" y="1228" class="cdesc" text-anchor="start">帧编解码 + DTO</text></g>
<g data-node="kode-vfs"><rect x="500" y="1182" width="280" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="520" y="1206" class="crate" text-anchor="start">kode-vfs</text><text x="520" y="1228" class="cdesc" text-anchor="start">虚拟文件系统</text></g>
<g data-node="kode-parser"><rect x="800" y="1182" width="280" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="820" y="1206" class="crate" text-anchor="start">kode-parser</text><text x="820" y="1228" class="cdesc" text-anchor="start">XML 状态机 + def 模型</text></g>
</g>
<g id="crate-row2" data-node="crate-row2">
<g data-node="kode-root"><rect x="200" y="1250" width="280" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="220" y="1274" class="crate" text-anchor="start">kode-root</text><text x="220" y="1296" class="cdesc" text-anchor="start">项目根发现</text></g>
<g data-node="kode-index"><rect x="500" y="1250" width="280" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="520" y="1274" class="crate" text-anchor="start">kode-index</text><text x="520" y="1296" class="cdesc" text-anchor="start">符号索引</text></g>
<g data-node="kode-types"><rect x="800" y="1250" width="280" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="820" y="1274" class="crate" text-anchor="start">kode-types</text><text x="820" y="1296" class="cdesc" text-anchor="start">类型图 IR</text></g>
</g>
<g id="crate-row3" data-node="crate-row3">
<g data-node="kode-scheduler"><rect x="200" y="1318" width="280" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="220" y="1342" class="crate" text-anchor="start">kode-scheduler</text><text x="220" y="1364" class="cdesc" text-anchor="start">失效调度 DAG + 调用依赖</text></g>
<g data-node="kode-python"><rect x="500" y="1318" width="280" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="520" y="1342" class="crate" text-anchor="start">kode-python</text><text x="520" y="1364" class="cdesc" text-anchor="start">Python 调用图 + 数据流</text></g>
<g data-node="kode-corpus"><rect x="800" y="1318" width="280" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="820" y="1342" class="crate" text-anchor="start">kode-corpus</text><text x="820" y="1364" class="cdesc" text-anchor="start">语料库</text></g>
</g>
</g>

