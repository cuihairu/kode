<text x="220" y="1094" class="body" text-anchor="start">spawn 子进程 · LSP 帧编解码(kode-protocol)· initialize 握手 · 崩溃重启(10s 窗口 / 3 次)</text>
</g>

<g id="crate-row1" data-node="crate-row1">
<g data-node="kode-protocol"><rect x="200" y="1118" width="205" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="220" y="1142" class="crate" text-anchor="start">kode-protocol</text><text x="220" y="1164" class="cdesc" text-anchor="start">帧编解码 + DTO</text></g>
<g data-node="kode-vfs"><rect x="425" y="1118" width="205" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="445" y="1142" class="crate" text-anchor="start">kode-vfs</text><text x="445" y="1164" class="cdesc" text-anchor="start">虚拟文件系统</text></g>
<g data-node="kode-parser"><rect x="650" y="1118" width="205" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="670" y="1142" class="crate" text-anchor="start">kode-parser</text><text x="670" y="1164" class="cdesc" text-anchor="start">XML 状态机 + def 模型</text></g>
<g data-node="kode-root"><rect x="875" y="1118" width="205" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="895" y="1142" class="crate" text-anchor="start">kode-root</text><text x="895" y="1164" class="cdesc" text-anchor="start">项目根发现</text></g>
</g>
<g id="crate-row2" data-node="crate-row2">
<g data-node="kode-index"><rect x="200" y="1186" width="205" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="220" y="1210" class="crate" text-anchor="start">kode-index</text><text x="220" y="1232" class="cdesc" text-anchor="start">符号索引</text></g>
<g data-node="kode-types"><rect x="425" y="1186" width="205" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="445" y="1210" class="crate" text-anchor="start">kode-types</text><text x="445" y="1232" class="cdesc" text-anchor="start">类型图 IR</text></g>
<g data-node="kode-scheduler"><rect x="650" y="1186" width="205" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="670" y="1210" class="crate" text-anchor="start">kode-scheduler</text><text x="670" y="1232" class="cdesc" text-anchor="start">失效调度</text></g>
<g data-node="kode-corpus"><rect x="875" y="1186" width="205" height="58" rx="10" fill="#fff" stroke="#fdba74"/><text x="895" y="1210" class="crate" text-anchor="start">kode-corpus</text><text x="895" y="1232" class="cdesc" text-anchor="start">语料库</text></g>
</g>
</g>

<!-- 底部:外部系统 -->
<g id="kbengine-source" data-node="kbengine-source"><rect x="40" y="1300" width="590" height="200" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
