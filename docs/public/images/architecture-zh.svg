<!-- 图例 / 注记 -->
<g id="docs-tooling" data-node="docs-tooling"><rect x="40" y="1636" width="1200" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="1662" class="small" text-anchor="start">仓库配套 · VitePress 文档站(docs/ · 双语 en/zh)· 本图嵌入中英首页与 README</text>
</g>
<text x="40" y="1698" class="small" text-anchor="start">虚线:控制 / 配置关系 · 实线:业务数据 · 无圆点交叉不表示连通</text>
<text x="40" y="1722" class="small" text-anchor="start">双轨切换:kodeCoreGate 默认 ts;rust 字面量受 serving 门禁拒绝,shadow 只做差异日志,用户可见行为不变</text>
<text x="40" y="1746" class="small" text-anchor="start">职责边界:Provider / 面板 / 数据面·索引面 / 服务器集成留在 TS 宿主;Rust core 以 RPC 承担解析·图·schema·lint,均有 TS 兜底</text>
</svg>
